# Copy to .github/workflows/release.yml. Publishes to npm with provenance when you push a tag such as v0.1.0.
# One-time setup: create an npm automation token or configure npm trusted publishing, add it as NPM_TOKEN
# (or follow npm's current trusted-publishing instructions), and enable two-factor authentication on the npm account.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write     # attach the SBOM to the GitHub release
  id-token: write     # required for npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build && node dist/cli.js lint .
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run
      - run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          files: sbom.cdx.json
